site_name: brain-stem
site_description: A personalization layer for Claude Code — governance reference and documentation for the brain-stem foundation.
site_url: https://peter-tiktinsky.github.io/brain-stem/
repo_url: https://github.com/peter-tiktinsky/brain-stem
repo_name: peter-tiktinsky/brain-stem

docs_dir: docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

# Explicit, ordered navigation. The reading sequence is deliberate (why → what →
# install → how → reference → decisions → release history); without this block MkDocs
# auto-sorts pages alphabetically and mis-orders the learning path.
nav:
  - Home: index.md
  - Why brain-stem: getting-started/why-brain-stem.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Install & upgrade: getting-started/index.md
      - Version migrations: getting-started/migrations.md
      - Core concepts: getting-started/concepts.md
      - Onboarding: getting-started/onboarding.md
      - "claude-mem (optional)": getting-started/claude-mem.md
      - Uninstalling: getting-started/uninstall.md
  - Architecture:
      - The governance engine: architecture/governance-engine.md
      - Vault governance: architecture/vault-governance.md
      - Context and memory: architecture/context-and-memory.md
      - The memory model: architecture/memory-model.md
      - Memory management: architecture/memory-management.md
      - The context library: architecture/context-library.md
      - Plans: architecture/plans.md
      - Sessions: architecture/sessions.md
      - Onboarding (lifecycle): architecture/onboarding-lifecycle.md
      - Packaging & runtime: architecture/packaging-runtime.md
  - Reference:
      - Commands: reference/commands.md
      - Glossary: reference/glossary.md
      - FAQ: reference/faq.md
  - Design decisions: decisions/index.md
  - Release notes:
      - v1.6.0: release-notes-v1.6.0.md
      - v1.5.0: release-notes-v1.5.0.md
      - v1.4.0: release-notes-v1.4.0.md
      - v1.3.0: release-notes-v1.3.0.md
      - v1.2.0: release-notes-v1.2.0.md
      - v1.1.4: release-notes-v1.1.4.md
      - v1.1.3: release-notes-v1.1.3.md
      - v1.1.2: release-notes-v1.1.2.md
      - v1.1.1: release-notes-v1.1.1.md
      - v1.0.0: release-notes-v1.0.0.md
